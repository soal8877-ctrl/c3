<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root,
        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --calc-bg: #ffffff;
            --calc-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --display-bg: #1a1a1a;
            --display-color: #ffffff;
            --btn-bg: #f0f0f0;
            --btn-color: #333;
            --btn-hover: #e0e0e0;
            --operator-bg: #667eea;
            --operator-hover: #5568d3;
            --equals-bg: #764ba2;
            --equals-hover: #653a8a;
            --clear-bg: #ff6b6b;
            --clear-hover: #ee5a5a;
            --theme-btn-bg: #f0f0f0;
            --theme-btn-color: #333;
            --theme-btn-hover: #e0e0e0;
            --history-border: #e8e8ee;
            --history-title: #555;
            --history-item-bg: #f7f7fb;
            --history-item-hover: #ececf4;
            --history-expr: #666;
            --history-result: #333;
            --history-empty: #999;
            --history-clear: #888;
            --history-clear-hover: #ff6b6b;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --calc-bg: #1e1e2e;
            --calc-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --display-bg: #0d0d14;
            --display-color: #e8e8f0;
            --btn-bg: #2a2a3e;
            --btn-color: #e8e8f0;
            --btn-hover: #3a3a52;
            --operator-bg: #5a6fd6;
            --operator-hover: #4a5fc6;
            --equals-bg: #8b5fb8;
            --equals-hover: #7a4fa7;
            --clear-bg: #e05555;
            --clear-hover: #c94545;
            --theme-btn-bg: #2a2a3e;
            --theme-btn-color: #e8e8f0;
            --theme-btn-hover: #3a3a52;
            --history-border: #2f2f44;
            --history-title: #b8b8cc;
            --history-item-bg: #262638;
            --history-item-hover: #32324a;
            --history-expr: #9a9ab0;
            --history-result: #e8e8f0;
            --history-empty: #6a6a80;
            --history-clear: #8a8aa0;
            --history-clear-hover: #e05555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            padding: 20px;
            transition: background 0.3s ease;
        }

        .app {
            display: flex;
            gap: 20px;
            align-items: stretch;
            max-width: 760px;
            width: 100%;
        }

        .calculator {
            background: var(--calc-bg);
            border-radius: 20px;
            box-shadow: var(--calc-shadow);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .history-panel {
            background: var(--calc-bg);
            border-radius: 20px;
            box-shadow: var(--calc-shadow);
            padding: 24px;
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            max-height: 560px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .history-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--history-title);
        }

        .history-clear-btn {
            background: none;
            border: none;
            color: var(--history-clear);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
            font-family: inherit;
        }

        .history-clear-btn:hover {
            color: var(--history-clear-hover);
            background: var(--history-item-bg);
        }

        .history-clear-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .history-clear-btn:disabled:hover {
            color: var(--history-clear);
            background: none;
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .history-empty {
            color: var(--history-empty);
            font-size: 0.95rem;
            text-align: center;
            padding: 40px 12px;
            margin: auto;
        }

        .history-item {
            background: var(--history-item-bg);
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item:hover {
            background: var(--history-item-hover);
            transform: translateY(-1px);
        }

        .history-expr {
            color: var(--history-expr);
            font-size: 0.85rem;
            word-break: break-all;
        }

        .history-result {
            color: var(--history-result);
            font-size: 1.15rem;
            font-weight: 700;
            word-break: break-all;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme-toggle {
            background: var(--theme-btn-bg);
            color: var(--theme-btn-color);
            border: none;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }

        .theme-toggle:hover {
            background: var(--theme-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle:active {
            transform: translateY(0);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-moon {
            display: inline;
        }

        [data-theme="dark"] .theme-toggle .icon-sun {
            display: inline;
        }

        .display {
            background: var(--display-bg);
            color: var(--display-color);
            font-size: 2.5rem;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .buttons button {
            background: var(--btn-bg);
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: var(--btn-color);
        }

        .buttons button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .buttons button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .operator {
            background: var(--operator-bg) !important;
            color: #ffffff !important;
        }

        .operator:hover {
            background: var(--operator-hover) !important;
        }

        .equals {
            background: var(--equals-bg) !important;
            color: #ffffff !important;
        }

        .equals:hover {
            background: var(--equals-hover) !important;
        }

        .clear {
            background: var(--clear-bg) !important;
            color: #ffffff !important;
        }

        .clear:hover {
            background: var(--clear-hover) !important;
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .app {
                flex-direction: column;
                align-items: center;
            }

            .calculator {
                max-width: 400px;
            }

            .history-panel {
                max-width: 400px;
                width: 100%;
                max-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="calculator">
            <div class="toolbar">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Переключить тему">
                    <span class="icon-moon" aria-hidden="true">🌙</span>
                    <span class="icon-sun" aria-hidden="true">☀️</span>
                </button>
            </div>
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendOperator('/')">/</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="operator" onclick="deleteLast()">⌫</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('-')">-</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="equals" onclick="calculate()" rowspan="2">=</button>
                
                <button class="zero" onclick="appendNumber('0')">0</button>
                <button onclick="appendDecimal()">.</button>
            </div>
        </div>

        <aside class="history-panel" aria-label="Журнал операций">
            <div class="history-header">
                <h2 class="history-title">Журнал</h2>
                <button type="button" class="history-clear-btn" id="clearHistoryBtn" disabled>Очистить</button>
            </div>
            <div class="history-list" id="historyList" role="list">
                <p class="history-empty" id="historyEmpty">Пока пусто — нажмите «=»</p>
            </div>
        </aside>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;
        const HISTORY_KEY = 'calculator-history';
        const HISTORY_LIMIT = 50;

        // Тема
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        function getPreferredTheme() {
            const saved = localStorage.getItem('calculator-theme');
            if (saved === 'light' || saved === 'dark') {
                return saved;
            }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            localStorage.setItem('calculator-theme', theme);
            themeToggle.setAttribute(
                'aria-label',
                theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'
            );
            themeToggle.setAttribute(
                'title',
                theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'
            );
        }

        applyTheme(getPreferredTheme());

        themeToggle.addEventListener('click', function () {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        });

        // Журнал операций
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        let history = loadHistory();

        function loadHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function formatExpression(expression) {
            return expression.replace(/\*/g, '×');
        }

        function addToHistory(expression, result) {
            history.unshift({
                expression: formatExpression(expression),
                result: result
            });
            if (history.length > HISTORY_LIMIT) {
                history = history.slice(0, HISTORY_LIMIT);
            }
            saveHistory();
            renderHistory();
        }

        function useHistoryResult(result) {
            currentInput = result;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearHistory() {
            history = [];
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            clearHistoryBtn.disabled = history.length === 0;

            if (history.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'history-empty';
                empty.id = 'historyEmpty';
                empty.textContent = 'Пока пусто — нажмите «=»';
                historyList.appendChild(empty);
                return;
            }

            history.forEach(function (entry) {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'history-item';
                item.setAttribute('role', 'listitem');
                item.title = 'Подставить результат';

                const expr = document.createElement('span');
                expr.className = 'history-expr';
                expr.textContent = entry.expression + ' =';

                const result = document.createElement('span');
                result.className = 'history-result';
                result.textContent = entry.result;

                item.appendChild(expr);
                item.appendChild(result);
                item.addEventListener('click', function () {
                    useHistoryResult(entry.result);
                });
                historyList.appendChild(item);
            });
        }

        clearHistoryBtn.addEventListener('click', clearHistory);
        renderHistory();

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(number) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (currentInput === '0') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(operator) {
            if (shouldResetDisplay) {
                shouldResetDisplay = false;
            }
            
            const lastChar = currentInput[currentInput.length - 1];
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + operator;
            } else {
                currentInput += operator;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                const originalExpression = currentInput;
                // Заменяем × на * для вычисления
                let expression = currentInput.replace(/×/g, '*');
                
                // Проверяем на деление на ноль
                if (expression.includes('/0') && !expression.includes('/0.')) {
                    currentInput = 'Ошибка';
                    updateDisplay();
                    shouldResetDisplay = true;
                    return;
                }
                
                const result = Function('"use strict"; return (' + expression + ')')();
                
                if (isNaN(result) || !isFinite(result)) {
                    currentInput = 'Ошибка';
                } else {
                    const resultStr = result.toString();
                    addToHistory(originalExpression, resultStr);
                    currentInput = resultStr;
                }
                
                updateDisplay();
                shouldResetDisplay = true;
            } catch (error) {
                currentInput = 'Ошибка';
                updateDisplay();
                shouldResetDisplay = true;
            }
        }

        function clearDisplay() {
            currentInput = '0';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay) {
                clearDisplay();
                return;
            }
            
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // Поддержка клавиатуры
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDecimal();
            } else if (key === '+') {
                appendOperator('+');
            } else if (key === '-') {
                appendOperator('-');
            } else if (key === '*') {
                appendOperator('*');
            } else if (key === '/') {
                event.preventDefault();
                appendOperator('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });
    </script>
</body>
</html>
